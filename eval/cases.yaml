# Ground truth for PostHog JS/Web SDK context retrieval.
#
# Every `gold` entry is a doc_path that genuinely answers the question — each
# one was checked against the actual section inventory in data/index.json, not
# guessed from the doc's name. Where several docs legitimately answer (PostHog
# documents `identify` in three places), all of them count as correct; the
# metric should not punish a system for picking a different valid source.
#
# `single_source: true` marks a restraint case. The question is narrow enough
# that one doc fully answers it, so dragging in a second source is a failure
# even though it costs nothing in hit-rate. These exist because recall-only
# metrics reward over-retrieval, and over-retrieval is the exact behaviour this
# project is arguing against. A system that returns everything scores 100% on
# hit rate and is useless.

