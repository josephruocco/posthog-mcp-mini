[project]
name = "posthog-context-mcp"
version = "0.1.0"
description = "An MCP server that serves PostHog's JS/Web SDK docs as agent-optimized context, with an eval harness that proves the context is good."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.scripts]
posthog-context-mcp = "posthog_context.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["posthog_context"]
